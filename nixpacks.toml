[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
    "pip install -r backend/requirements.txt",
    "npm --prefix frontend ci"
]

[phases.build]
cmds = ["npm --prefix frontend run build"]

[start]
cmd = "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
